// This defines protocol for Slate - Atherton interactions
// Atherton calls into this via Glink

syntax = "proto2";
package bluetooth.synergy.SynergyProto;

/** RFCOMM Security Flags **/
enum ss_rfcomm_security_flags {
	SS_RFCOMM_SEC_FLAG_ENCRYPT = 1;
	SS_RFCOMM_SEC_FLAG_AUTH = 2;
	SS_RFCOMM_SEC_FLAG_NO_SDP = 4;
	SS_RFCOMM_SEC_FLAG_AUTH_MITM = 8;
	SS_RFCOMM_SEC_FLAG_AUTH_16_DIGIT = 16;
	SS_SEC_FLAG_LE_COC = 32;
	SS_SEC_FLAG_L2CAP = 64;
}

/** Create Socket Channel */
message ss_create_socket_channel {
	required bytes service_name = 1;
	required bytes service_uuid = 2;
	required uint32 channel = 3;
	required uint32 flags = 4;
	required uint32 sock_fd = 5;
}

/** Connect Socket */
message ss_connect_socket {
    required bytes bd_addr = 1;
	required bytes service_uuid = 2;
	required uint32 channel = 3;
	required uint32 flags = 4;
	required uint32 sock_fd = 5;
}

/** Socket Accept done */
message ss_rfcomm_srv_accept_done {
	required uint32 sock_fd = 1;
	required uint32 accept_fd = 2;
	required bytes addr = 3;
	required uint32 channel = 4;
	required bool status = 5;
}

/** Disconnect */
message ss_disconnect_socket {
    required uint32 sock_fd = 1;
	required uint32 channel = 2;
}

/** rfcomm server channel callback */
message ss_rfcomm_scn_callback {
	required uint32 sock_fd = 1;
	required uint32 scn = 2;
}

/** rfcomm server open callback */
message ss_rfcomm_srv_open_callback{
	required uint32 sock_fd = 1;
	required bytes addr = 2;
	required uint32 channel = 3;
	required uint32 status = 4;
	required uint32 tx_mtu = 5;
}

/** rfcomm server open callback */
message ss_rfcomm_cli_connect_callback{
	required uint32 sock_fd = 1;
	required bytes addr = 2;
	required uint32 channel = 3;
	required uint32 status = 4;
	required uint32 tx_mtu = 5;
}

/** rfcomm write data */
message ss_write_rfcomm_data {
	required uint32 sock_fd = 1;
	required uint32 channel = 2;
	required uint32 data_len = 3;
	required bytes data = 4;
}

/** rfcomm data callback */
message ss_rfcomm_data_callback{
	required uint32 sock_fd = 1;
	required uint32 channel = 2;
	required uint32 data_len = 3;
	required bytes data = 4;
}

/** rfcomm disconnect callback */
message ss_rfcomm_disconnect_callback{
	required uint32 sock_fd = 1;
	required uint32 channel = 2;
}

/** rfcomm server close */
message ss_rfcomm_server_close{
	required uint32 sock_fd = 1;
	required uint32 channel = 2;
}
