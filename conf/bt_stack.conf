# Disable BR/EDR discovery after LE pairing to avoid cross key derivation errors
#PTS_DisableSDPOnLEPair=true

# SMP Pair options (formatted as hex bytes) auth, io, ikey, rkey, ksize
#PTS_SmpOptions=0xD,0x4,0xf,0xf,0x10

# PTS AVRCP Test mode
#PTS_AvrcpTest=true

# SMP Certification Failure Cases
# Set any of the following SMP error values (from smp_api_types.h)
# to induce pairing failues for various PTS SMP test cases.
# Setting PTS_SmpFailureCase to 0 means normal operation.
# Failure modes:
#
#  SMP_PASSKEY_ENTRY_FAIL = 1
#  SMP_PAIR_AUTH_FAIL = 3
#  SMP_CONFIRM_VALUE_ERR = 4
#  SMP_PAIR_NOT_SUPPORT = 5
#  SMP_PAIR_FAIL_UNKNOWN = 8
#  SMP_REPEATED_ATTEMPTS = 9
#  SMP_NUMERIC_COMPAR_FAIL = 12
#PTS_SmpFailureCase=0

# LPM Local configuration
# 1st Param is wake_mode i.e 0 - Transport sleep, 1 - OOB wake
# 2nd Param is WakeupFilteringFlags i.e BIT(0) - Whitelist, BIT(1) - ADV Data Pattern,
#    BIT(2) - Accept connection from Directed advertising, BIT(3) - undirected advertising
# 3rd Param is WakeSources i.e BIT(0) - BLE Scan, BIT(1) - BLE Advertise, BIT(2) - Page Scan
#    BIT(3) - HID, BIT(4) - HOGP, BIT(5) - FMP, BIT(6) - PXP
# 4th Param is Delay to Sleep in Micro Seconds
#LPM_WAKEUP_CONFIG=0x00,0x01,0xF00C,0x0000
# Configuration for HID
#LPM_WAKEUP_CONFIG=0x00,0x01,0x0C,0x00F0
#CONFIGURATION FOR HOGP - BLE SCAN, HOGP
LPM_WAKEUP_CONFIG=0x01,0x01,0x22,0x00F0,00:00:00:00:00:00,0x0384,0x00,0x00
#CONFIGURATION FOR HOGP - BLE SCAN
#LPM_WAKEUP_CONFIG=0x00,0x01,0x01,0x00F0
#CONFIGURATION FOR PXP - BLE ADV,PXP
#LPM_WAKEUP_CONFIG=0x00,0x01,0x62,0x0000
#CONFIGURATION FOR FMP(YARDHOLD) - BLE ADV,FMP
#LPM_WAKEUP_CONFIG=0x00,0x01,0x22,0x0000

#LPM Page scan Params
# 1st Param is page_scan_interaval Eg:0x0800 meaning 1.28s i.e 0.625*2048
# Eg:0x0010 meaning 10ms i.e 16x0.625ms
# 2nd Param is page_scan_window Eg:0x0024 meaning 22.5ms i.e 0.625*36
# Eg:0x0010 meaning 10ms i.e 16x0.625ms
LPM_PAGE_SCAN_PARAMS=0x1000,0x0011

#LPM BLE SCAN PARAMS
#1st param is BLE SCAN TYPE
#2nd param is BLE scan interaval Eg:0x0010 meaning 10ms i.e 16x0.625ms
#3rd Param is BLE scan window Eg:0x0010 meaning 10ms i.e 16x0.625ms
#4th Param is BLE Scan filter policy
#LPM_BLE_SCAN_PARAMS=0x0016,0x0016,0x01,0x01
#LPM_BLE_SCAN_PARAMS=0x0016,0x0012,0x01,0x01
LPM_BLE_SCAN_PARAMS=0x0004,0x0004,0x01,0x01

#LPM Adv Params for Yardhold usecase
# 1st Param is adv_int_min  Eg:0x0010 meaning 10ms i.e 16x0.625ms
# 2nd Param is adv_int_max  Eg:0x0024 meaning 22.5ms i.e 36x0.625ms
# 3rd Param is adv_type  Eg:0x00
# 4th Param is adv_filter_policy  Eg:0x00
# 5th Param is adv_data. Total length should not exceed 32 bytes(1st byte is adv_len,2nd byte is adv_byte and from 3rd it is data.)
LPM_BLE_ADV_PARAMS=0x0030,0x0030,0x00,0x00,0x09095175616c636f6d6d

# LPM BLE Connection parameter
# 1st param is connection interval min. 2 bytes.
# 2nd param is connection interval max. 2 bytes.
# 3rd param is latency. 2 bytes.
# 4th param is supervision timeout. 2 bytes.
# 5th param is idle time. (Idle time to issue Conn params update in case of slave (in Milliseconds)). 2 bytes.
LPM_BLE_CONN_PARAMS=0x0006,0x0064,0x0000,0x0C80,0x0064
