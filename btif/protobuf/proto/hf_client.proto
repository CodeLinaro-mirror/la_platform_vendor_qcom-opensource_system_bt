syntax = "proto2";
package headsetClient.synergy.SynergyProto;

enum ss_bthf_client_connection_state_t{
    SS_BTHF_CLIENT_CONNECTION_STATE_DISCONNECTED = 0;
    SS_BTHF_CLIENT_CONNECTION_STATE_CONNECTING = 1;
    SS_BTHF_CLIENT_CONNECTION_STATE_CONNECTED = 2;
    SS_BTHF_CLIENT_CONNECTION_STATE_SLC_CONNECTED = 3;
    SS_BTHF_CLIENT_CONNECTION_STATE_DISCONNECTING = 4;
};

enum ss_bthf_client_audio_state_t{
    SS_BTHF_CLIENT_AUDIO_STATE_DISCONNECTED = 0;
    SS_BTHF_CLIENT_AUDIO_STATE_CONNECTING = 1;
    SS_BTHF_CLIENT_AUDIO_STATE_CONNECTED = 2;
    SS_BTHF_CLIENT_AUDIO_STATE_CONNECTED_MSBC = 3;
};

enum ss_bthf_client_vr_state_t{
    SS_BTHF_CLIENT_VR_STATE_STOPPED = 0;
    SS_BTHF_CLIENT_VR_STATE_STARTED = 1;
};

enum ss_bthf_client_volume_type_t{
    SS_BTHF_CLIENT_VOLUME_TYPE_SPK = 0;
    SS_BTHF_CLIENT_VOLUME_TYPE_MIC = 1;
};

enum ss_bthf_client_network_state_t{
    SS_BTHF_CLIENT_NETWORK_STATE_NOT_AVAILABLE = 0;
    SS_BTHF_CLIENT_NETWORK_STATE_AVAILABLE = 1;
};

enum ss_bthf_client_service_type_t{
    SS_BTHF_CLIENT_SERVICE_TYPE_HOME = 0;
    SS_BTHF_CLIENT_SERVICE_TYPE_ROAMING = 1;
};

enum ss_bthf_client_call_state_t{
    SS_BTHF_CLIENT_CALL_STATE_ACTIVE = 0;
    SS_BTHF_CLIENT_CALL_STATE_HELD = 1;
    SS_BTHF_CLIENT_CALL_STATE_DIALING = 2;
    SS_BTHF_CLIENT_CALL_STATE_ALERTING = 3;
    SS_BTHF_CLIENT_CALL_STATE_INCOMING = 4;
    SS_BTHF_CLIENT_CALL_STATE_WAITING = 5;
    SS_BTHF_CLIENT_CALL_STATE_HELD_BY_RESP_HOLD = 6;
};

enum ss_bthf_client_call_t{
    SS_BTHF_CLIENT_CALL_NO_CALLS_IN_PROGRESS = 0;
    SS_BTHF_CLIENT_CALL_CALLS_IN_PROGRESS = 1;
};

enum ss_bthf_client_callsetup_t{
    SS_BTHF_CLIENT_CALLSETUP_NONE = 0;
    SS_BTHF_CLIENT_CALLSETUP_INCOMING = 1;
    SS_BTHF_CLIENT_CALLSETUP_OUTGOING = 2;
    SS_BTHF_CLIENT_CALLSETUP_ALERTING = 3;

};

enum ss_bthf_client_callheld_t{
    SS_BTHF_CLIENT_CALLHELD_NONE = 0;
    SS_BTHF_CLIENT_CALLHELD_HOLD_AND_ACTIVE = 1;
    SS_BTHF_CLIENT_CALLHELD_HOLD = 2;
};

enum ss_bthf_client_resp_and_hold_t{
    SS_BTHF_CLIENT_RESP_AND_HOLD_HELD = 0;
    SS_BTRH_CLIENT_RESP_AND_HOLD_ACCEPT = 1;
    SS_BTRH_CLIENT_RESP_AND_HOLD_REJECT = 2;
};

enum ss_bthf_client_call_direction_t{
    SS_BTHF_CLIENT_CALL_DIRECTION_OUTGOING = 0;
    SS_BTHF_CLIENT_CALL_DIRECTION_INCOMING = 1;
};

enum ss_bthf_client_call_mpty_type_t{
     SS_BTHF_CLIENT_CALL_MPTY_TYPE_SINGLE = 0;
     SS_BTHF_CLIENT_CALL_MPTY_TYPE_MULTI = 1;
};

enum ss_bthf_client_cmd_complete_t{
     SS_BTHF_CLIENT_CMD_COMPLETE_OK = 0;
     SS_BTHF_CLIENT_CMD_COMPLETE_ERROR = 1;
     SS_BTHF_CLIENT_CMD_COMPLETE_ERROR_NO_CARRIER = 2;
     SS_BTHF_CLIENT_CMD_COMPLETE_ERROR_BUSY = 3;
     SS_BTHF_CLIENT_CMD_COMPLETE_ERROR_NO_ANSWER = 4;
     SS_BTHF_CLIENT_CMD_COMPLETE_ERROR_DELAYED = 5;
     SS_BTHF_CLIENT_CMD_COMPLETE_ERROR_BLACKLISTED = 6;
     SS_BTHF_CLIENT_CMD_COMPLETE_ERROR_CME = 7;
};

enum ss_bthf_client_call_action_t{
     SS_BTHF_CLIENT_CALL_ACTION_CHLD_0 = 0;
     SS_BTHF_CLIENT_CALL_ACTION_CHLD_1 = 1;
     SS_BTHF_CLIENT_CALL_ACTION_CHLD_2 = 2;
     SS_BTHF_CLIENT_CALL_ACTION_CHLD_3 = 3;
     SS_BTHF_CLIENT_CALL_ACTION_CHLD_4= 4;
     SS_BTHF_CLIENT_CALL_ACTION_CHLD_1x = 5;
     SS_BTHF_CLIENT_CALL_ACTION_CHLD_2x = 6;
     SS_BTHF_CLIENT_CALL_ACTION_ATA = 7;
     SS_BTHF_CLIENT_CALL_ACTION_CHUP = 8;
     SS_BTHF_CLIENT_CALL_ACTION_BTRH_0 = 9;
     SS_BTHF_CLIENT_CALL_ACTION_BTRH_1 = 10;
     SS_BTHF_CLIENT_CALL_ACTION_BTRH_2 = 11;
};

enum ss_bthf_client_subscriber_service_type_t{
     SS_BTHF_CLIENT_SERVICE_UNKNOWN = 0;
     SS_BTHF_CLIENT_SERVICE_VOICE = 1;
     SS_BTHF_CLIENT_SERVICE_FAX = 2;
};

enum ss_bthf_client_in_band_ring_state_t{
     SS_BTHF_CLIENT_IN_BAND_RINGTONE_NOT_PROVIDED = 0;
     SS_BTHF_CLIENT_IN_BAND_RINGTONE_PROVIDED = 1;
};

 /* Bt_Hf_Client callbacks */

 /** Callback for connection state change.
  *  state will have one of the values from BtHfConnectionState
  *  peer/chld_features are valid only for BTHF_CLIENT_CONNECTION_STATE_SLC_CONNECTED state
  */
 message ss_bthf_client_connection_state_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_connection_state_t state = 2;
   required int32 peer_feat = 3;
   required int32 chld_feat = 4;
 }

 /** Callback for audio connection state change.
  *  state will have one of the values from BtHfAudioState
  */
 message ss_bthf_client_audio_state_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_audio_state_t state = 2;
 }

 /** Callback for VR connection state change.
  *  state will have one of the values from BtHfVRState
  */
 message ss_bthf_client_vr_cmd_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_vr_state_t state = 2;
 }

 /** Callback for network state change
  */
 message ss_bthf_client_network_state_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_network_state_t state = 2;
 }

 /** Callback for network roaming status change
  */
 message ss_bthf_client_network_roaming_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_service_type_t type = 2;
 }

 /** Callback for signal strength indication
  */
 message ss_bthf_client_network_signal_callback {
   required bytes bd_addr = 1;
   required int32 signal_strength = 2;
 }

 /** Callback for battery level indication
  */
 message ss_bthf_client_battery_level_callback {
   required bytes bd_addr = 1;
   required int32 battery_level = 2;
 }

 /** Callback for current operator name
  */
 message ss_bthf_client_current_operator_callback {
   required bytes bd_addr = 1;
   required bytes name = 2;
 }

 /** Callback for call indicator
  */
 message ss_bthf_client_call_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_call_t call = 2;
 }

 /** Callback for callsetup indicator
  */
 message ss_bthf_client_callsetup_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_callsetup_t callsetup = 2;
 }

 /** Callback for callheld indicator
  */
 message ss_bthf_client_callheld_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_callheld_t callheld = 2;
 }

 /** Callback for response and hold
  */
 message ss_bthf_client_resp_and_hold_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_resp_and_hold_t resp_and_hold = 2;
 }

 /** Callback for Calling Line Identification notification
  *  Will be called only when there is an incoming call and number is provided.
  */
 message ss_bthf_client_clip_callback {
   required bytes bd_addr = 1;
   required bytes number = 2;
 }

 /**
  * Callback for Call Waiting notification
  */
 message ss_bthf_client_call_waiting_callback {
   required bytes bd_addr = 1;
   required bytes number = 2;
 }

 /**
  *  Callback for listing current calls. Can be called multiple time.
  *  If number is unknown NULL is passed.
  */
 message ss_bthf_client_current_calls {
   required bytes bd_addr = 1;
   required int32 index = 2;
   required ss_bthf_client_call_direction_t dir = 3;
   required ss_bthf_client_call_state_t state = 4;
   required ss_bthf_client_call_mpty_type_t mpty = 5;
   required bytes number = 6;
 }

 /** Callback for audio volume change
  */
 message ss_bthf_client_volume_change_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_volume_type_t type = 2;
   required int32 volume = 3;
 }

 /** Callback for command complete event
  *  cme is valid only for BTHF_CLIENT_CMD_COMPLETE_ERROR_CME type
  */
 message ss_bthf_client_cmd_complete_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_cmd_complete_t type = 2;
   required int32 cme = 3;
 }

 /** Callback for subscriber information
  */
 message ss_bthf_client_subscriber_info_callback {
   required bytes bd_addr = 1;
   required bytes name = 2;
   required ss_bthf_client_subscriber_service_type_t type = 3;
 }

 /** Callback for in-band ring tone settings
  */
 message ss_bthf_client_in_band_ring_tone_callback {
   required bytes bd_addr = 1;
   required ss_bthf_client_in_band_ring_state_t state = 2;
 }

 /**
  * Callback for requested number from AG
  */
 message ss_bthf_client_last_voice_tag_number_callback {
   required bytes bd_addr = 1;
   required bytes number = 2;
 }

 /**
  * Callback for sending ring indication to app
  */
 message ss_bthf_client_ring_indication_callback {
   required bytes bd_addr = 1;
 }

 /**
  * Callback for sending unknown (vendor specific) event
  */
 message ss_bthf_client_unknown_event_callback {
   required bytes bd_addr = 1;
   required bytes unknow_event = 2;
 }

  /* Bt_Hf_client APIs */

 message ss_init {
    required int32 features = 1;
}

 /** connect to audio gateway */
 message ss_Connect {
    required bytes bd_addr = 1;
 }

 /** disconnect from audio gateway */
 message ss_Disconnect {
    required bytes bd_addr = 1;
 }

 /** create an audio connection */
 message ss_Connect_audio {
    required bytes bd_addr = 1;
 }

 /** close the audio connection */
 message ss_Disconnect_audio {
    required bytes bd_addr = 1;
 }

 /** start voice recognition */
 message ss_start_voice_recognition {
    required bytes bd_addr = 1;
 }

 /** stop voice recognition */
 message ss_stop_voice_recognition {
    required bytes bd_addr = 1;
 }

 /** volume control */
 message ss_volume_control {
    required bytes bd_addr = 1;
    required ss_bthf_client_volume_type_t type = 2;
    required int32 volume = 3;
 }

 /** place a call with number a number
  * if number is NULL last called number is called (aka re-dial)*/
 message ss_dial {
    required bytes bd_addr = 1;
    required bytes number = 2;
}

 /** place a call with number specified by location (speed dial) */
 message ss_dial_memory {
    required bytes bd_addr = 1;
    required int32 location = 2;
 }

 /** perform specified call related action
  * idx is limited only for enhanced call control related action
  */
 message ss_handle_call_action {
    required bytes bd_addr = 1;
    required ss_bthf_client_call_action_t action = 2;
    required int32 idx = 3;
 }

 /** query list of current calls */
 message ss_query_current_calls {
    required bytes bd_addr = 1;
}

 /** query name of current selected operator */
 message ss_query_current_operator_name {
    required bytes bd_addr = 1;
 }

 /** Retrieve subscriber information */
 message ss_retrieve_subscriber_info {
    required bytes bd_addr = 1;
 }

 /** Send DTMF code*/
 message ss_send_dtmf {
    required bytes bd_addr = 1;
    required bytes code = 2;
 }

 /** Request a phone number from AG corresponding to last voice tag recorded */
 message ss_request_last_voice_tag_number {
    required bytes bd_addr = 1;
 }

 /** Closes the interface. */
 message ss_cleanup {
 }

 /** Send AT Command. */
 message ss_send_at_cmd {
    required bytes bd_addr = 1;
    required int32 cmd = 2;
    required int32 val1 = 3;
    required int32 val2 = 4;
    required bytes arg = 5;
}
